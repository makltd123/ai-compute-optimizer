[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-compute-optimizer"
version = "0.1.0"
description = "Research MVP for adaptive AI inference cost/quality optimization"
requires-python = ">=3.10"
dependencies = [
  "mistralai>=1.8.0",
  "PyYAML>=6.0",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "tenacity>=8.2",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
bench = ["datasets>=2.18"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
